spring:
  kafka:
    bootstrap-servers: localhost:9092

topics:
  user-actions: stats.user-actions.v1
  similarity: stats.events-similarity.v1

weights:
  view: 1.0
  register: 3.0
  like: 5.0

grpc:
  client:
    collector:
      address: discovery:///collector
      negotiationType: plaintext
      enableKeepAlive: true
      keepAliveWithoutCalls: true
    analyzer:
      address: discovery:///analyzer
      negotiationType: plaintext
      enableKeepAlive: true
      keepAliveWithoutCalls: true

aggregator:
  group-id: aggregator-v1
  kafka:
    bootstrap-servers: "localhost:9092"
    producer:
      properties:
        "bootstrap.servers": ${aggregator.kafka.bootstrap-servers}
        "key.serializer": "org.apache.kafka.common.serialization.StringSerializer"
        "value.serializer": "ru.practicum.stats.avro.serializer.GeneralAvroSerializer"
        "linger.ms": 0
      topic: "stats.events-similarity.v1"

    consumer:
      properties:
        "bootstrap.servers": ${aggregator.kafka.bootstrap-servers}
        "enable.auto.commit": false
        "group.id": "stats.aggregator.actions"
        "key.deserializer": "org.apache.kafka.common.serialization.StringDeserializer"
        "value.deserializer": "ru.practicum.stats.avro.deserializer.UserActionDeserializer"
      topic: "stats.user-actions.v1"
      poll-timeout: 100ms