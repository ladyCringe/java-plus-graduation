server:
  port: 0

spring:
  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 3000
        max-attempts: 10
        max-interval: 10000
  jackson:
    time-zone: UTC
  kafka:
    bootstrap-servers: localhost:9092
  datasource:
    url: jdbc:postgresql://localhost:7004/analyzer
    username: analyzer
    password: analyzer
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate

topics:
  user-actions: stats.user-actions.v1
  similarity: stats.events-similarity.v1

reco:
  recentLimit: 10
  neighborsK: 5

grpc:
  server:
    port: 59092


analyzer:
  group-id: analyzer-v1
  kafka:
    common-properties:
      "bootstrap.servers": "localhost:9092"
      "key.deserializer": "org.apache.kafka.common.serialization.StringDeserializer"
      "enable.auto.commit": false
    consumers:
      - type: UserActionProcessor
        properties:
          "value.deserializer": "ru.practicum.stats.avro.deserializer.UserActionDeserializer"
          "group.id": "stats.analyzer.actions"
        topics:
          - "stats.user-actions.v1"
        poll-timeout: 500ms
      - type: SimilarityProcessor
        properties:
          "value.deserializer": "ru.practicum.stats.avro.deserializer.EventsSimilarityDeserializer"
          "group.id": "stats.analyzer.similarity"
        topics:
          - "stats.events-similarity.v1"
        poll-timeout: 500ms