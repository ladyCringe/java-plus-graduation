server:
  port: 0

spring:
  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 3000
        max-attempts: 10
        max-interval: 10000
  jackson:
    time-zone: UTC
  kafka:
    bootstrap-servers: localhost:9092
  datasource:
    url: jdbc:postgresql://localhost:7004/analyzer
    username: analyzer
    password: analyzer
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate

analyzer:
  group-id: analyzer-v1

topics:
  user-actions: stats.user-actions.v1
  similarity: stats.events-similarity.v1

reco:
  recentLimit: 10
  neighborsK: 5

grpc:
  server:
    port: 59092
