spring:
  kafka:
    bootstrap-servers: localhost:9092
  datasource:
    url: jdbc:postgresql://localhost:7004/analyzer
    username: analyzer
    password: analyzer
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate

analyzer:
  group-id: analyzer-v1

topics:
  user-actions: stats.user-actions.v1
  similarity: stats.events-similarity.v1

reco:
  recentLimit: 10
  neighborsK: 5

grpc:
  server:
    port: 0

eureka:
  client:
    instance-info-replication-interval-seconds: 1
    registry-fetch-interval-seconds: 1
    should-unregister-on-shutdown: true
  instance:
    lease-renewal-interval-in-seconds: 1
    lease-expiration-duration-in-seconds: 1
    metadata-map:
      gRPC_port: ${grpc.server.port}
