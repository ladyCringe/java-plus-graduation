spring:
  kafka:
    bootstrap-servers: localhost:9092
  datasource:
    url: jdbc:postgresql://localhost:7004/analyzer
    username: analyzer
    password: analyzer
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate

analyzer:
  group-id: analyzer-v1

topics:
  user-actions: stats.user-actions.v1
  similarity: stats.events-similarity.v1

reco:
  recentLimit: 10
  neighborsK: 5

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

grpc:
  server:
    port: 0
